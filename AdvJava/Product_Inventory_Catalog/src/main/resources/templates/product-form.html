<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Entry Form</title>
</head>
<body>
    <h2 th:text="${product.id == null} ? 'Add Product Blueprint' : 'Edit Product Blueprint'">Form Header</h2>
    
    <form th:action="@{/products/save}" th:object="${product}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div>
            <label>Product Name:</label>
            <input type="text" th:field="*{name}" />
            <span style="color:red" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</span>
        </div>
        <br/>
        <div>
            <label>Category:</label>
            <input type="text" th:field="*{category}" />
            <span style="color:red" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Category Error</span>
        </div>
        <br/>
        <div>
            <label>Price (Rs.):</label>
            <input type="number" step="0.01" th:field="*{price}" />
            <span style="color:red" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price Error</span>
        </div>
        <br/>
        <div>
            <label>Stock Quantity:</label>
            <input type="number" th:field="*{stockQuantity}" />
            <span style="color:red" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}">Stock Error</span>
        </div>
        <br/>
        <button type="submit">Save Product Data</button>
        <a th:href="@{/products}">Cancel</a>
    </form>
</body>
</html>
