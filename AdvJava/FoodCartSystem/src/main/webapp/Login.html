<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
</head>

<body>

<!-- 
	Entry Point of the web app, upon submit/Login button hit. The post action "posts" data to the servlet
	PS: you have to define what action html has to take, like in this case you arre stating
		1> Upon submit go to LoginServlet
		2> The nature of submit is post (Take user input data)
		3> The Login Servlet will process this data and decide accordingly
 -->

	<div>
		<form action="LoginServlet" method="POST"
			style="display: flex; flex-direction: column; align-items: center; gap: 1vh">
			<input type="text" placeholder="UserName" name="username" style="max-width: 10vw; border: 2px solid">
			<input type="password" placeholder="password" name="password" style="max-width: 10vw; border: 2px solid">
			<input type="submit" value="Login">
		</form>
	</div>

</body>

</html>
